services:
  # Web server
  - type: web
    name: newsreel-perspectives
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false  # set manually in Render dashboard
      - key: RENDER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.6"

  # NOTE: The daily pipeline cron that used to live here was removed.
  # It duplicated the GitHub Actions workflow (.github/workflows/daily-pipeline.yml),
  # which is the single source of truth for collection, clustering, the git
  # push, the Supabase sync, and the Render deploy trigger. Running both raced
  # on the git push. Keep exactly one scheduler.
