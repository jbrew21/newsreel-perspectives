name: Daily Perspectives Pipeline

on:
  schedule:
    # Off-peak, odd-minute slots to dodge GitHub's congested top-of-hour
    # scheduler (which was drifting the old '0 11' run 2-5 hours late and
    # missing the 7 AM ET deadline). 06:17 UTC = ~2 AM ET primary run;
    # 08:17 UTC = ~4 AM ET backstop in case the first is dropped. Both
    # finish well before the 7 AM ET local git-pull. Index date is stamped
    # from the runner's UTC clock, so any run after 00:00 UTC is "today."
    - cron: '17 6 * * *'
    - cron: '17 8 * * *'
    # Midday refresh so the site is fresh during business hours (~1 PM ET).
    # 17:17 UTC = 1:17 PM EDT / 12:17 PM EST. Cross-day reuse + Batch API
    # (Jul 2026) make this run ~$0.75 — mostly re-scrapes, few new posts.
    - cron: '17 17 * * *'
    # Midday backstop, mirroring the 06:17/08:17 morning pair. 19:17 UTC =
    # 3:17 PM ET. The single midday run had no fallback, so when GitHub
    # dropped it / couldn't acquire a hosted runner (Aug 6 2026, run
    # 31126229962), the site got no midday refresh until the next morning.
    # Public repo = free Actions minutes, and the concurrency group below
    # makes this a no-op re-scrape if the 17:17 run already succeeded.
    - cron: '17 19 * * *'
  workflow_dispatch:

# Never run two pipelines at once. A manual trigger queues behind an
# in-flight scheduled run instead of racing it to the git push.
concurrency:
  group: daily-perspectives-pipeline
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

permissions:
  contents: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Collect posts from all voices
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/collect.py

      - name: Enrich YouTube transcripts
        continue-on-error: true
        run: python scripts/enrich_transcripts.py

      - name: Build stories with argument clustering
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/stories.py

      - name: Verify topic index is not empty
        run: |
          IDX="data/posts/topic-index-$(date -u +%Y-%m-%d).json"
          SIZE=$(stat -c%s "$IDX" 2>/dev/null || echo 0)
          echo "Topic index: $IDX ($SIZE bytes)"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::Topic index is empty or missing ($SIZE bytes). Claude steps likely failed silently — check ANTHROPIC_API_KEY."
            exit 1
          fi

      - name: Sync to Supabase
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pip install supabase
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from pipeline import sync_to_supabase
          ok = sync_to_supabase()
          sys.exit(0 if ok else 1)
          "

      - name: Prune old aggregate files (30d) and per-person archives (45d)
        run: |
          python3 - <<'PY'
          import os, glob, re, datetime, subprocess
          root = 'data/posts'
          today = datetime.date.today()
          agg_cutoff = today - datetime.timedelta(days=30)
          # Per-person archives are read by lookup.py's auto-expanding search,
          # which widens up to a 30-day window (scripts/lookup.py). Keep 45 days
          # so there is always a 15-day buffer beyond the widest lookback, then
          # drop the rest -- unbounded per-person history had grown data/posts
          # to 671MB / ~34k files and was wedging free-tier Render spin-ups.
          post_cutoff = today - datetime.timedelta(days=45)

          def git_rm(paths):
              # Batch to keep the daily run fast and avoid one process per file.
              for i in range(0, len(paths), 500):
                  subprocess.run(['git', 'rm', '-q', '--'] + paths[i:i + 500],
                                 check=False)

          # 1) Top-level dated AGGREGATE files -- only the latest is ever read.
          agg = []
          for prefix in ('topic-index-', 'stories-', 'fractures-'):
              for path in glob.glob(os.path.join(root, prefix + '*.json')):
                  datestr = os.path.basename(path)[len(prefix):-5]
                  try:
                      d = datetime.date.fromisoformat(datestr)
                  except ValueError:
                      continue  # not a plain dated file; skip
                  if d < agg_cutoff:
                      agg.append(path)
          git_rm(agg)

          # 2) Per-person archives: data/posts/<voice>/<YYYY-MM-DD>.json
          dated = re.compile(r'^(\d{4}-\d{2}-\d{2})\.json$')
          posts = []
          for voice in os.listdir(root):
              vdir = os.path.join(root, voice)
              if not os.path.isdir(vdir):
                  continue
              for fn in os.listdir(vdir):
                  m = dated.match(fn)
                  if m and m.group(1) < post_cutoff.isoformat():
                      posts.append(os.path.join(vdir, fn))
          git_rm(posts)

          print(f'Pruned {len(agg)} aggregate files (<{agg_cutoff}) and '
                f'{len(posts)} per-person archives (<{post_cutoff}).')
          PY

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts/ data/cluster-history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily pipeline: $(date -u +%Y-%m-%d)"
            # Collision-proof push: rebase on any concurrent push (e.g. the
            # backstop cron or a manual run), then push, retrying a few times.
            # Conflicts only ever occur in regenerated data/ files, so resolve
            # them in favor of OUR freshly-built version (--theirs during a
            # rebase = the commit being replayed = ours). Always abort a wedged
            # rebase before retrying so we never loop on unmerged files.
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main || true
              if ! git rebase origin/main; then
                git checkout --theirs -- data/ 2>/dev/null || true
                git add data/
                if ! GIT_EDITOR=true git rebase --continue; then
                  git rebase --abort || true
                  echo "Push attempt $attempt: rebase failed; re-syncing..."
                  sleep 5
                  continue
                fi
              fi
              if git push; then pushed=true; break; fi
              echo "Push attempt $attempt failed (likely a concurrent push); re-syncing..."
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Could not push after 5 attempts."
              exit 1
            fi
          fi

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/srv-d6pitsmuk2gs73fhkj70/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
