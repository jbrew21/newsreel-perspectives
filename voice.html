<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perspectives · Newsreel</title>
<!--
  Newsreel Perspectives — tracked-voice profile (REDESIGN, Sep 2026)
  Single template for ALL voices. Reads:
    /data/voices.json          → voice meta (name, lens, photo, + optional `overview`)
    /data/stances/{id}.json     → positions (date, topic, stance, summary, quote, sourceUrl, platform)
  No per-page work: every voice is this file with different JSON.
  The only new data field is voice.overview (one cheap cached Haiku summary; see BRIJESH spec).
-->
<style>
  :root{
    --bg:#0a0a0b; --panel:#161619; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
    --tx:#fafafa; --tx-2:#cac8c3; --tx-3:#a3a19c; --tx-4:#83817a; --dt:#8a8884;
    --gold:#EDBD1F; --gold-soft:rgba(237,189,31,.13); --cta:#FF6343;
    --r:8px;
    --serif:'Bree Serif',Georgia,'Times New Roman',serif;
    --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}

  .masthead{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .mast-in{max-width:952px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;justify-content:space-between}
  .back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--tx-3);transition:color .13s}
  .back:hover{color:var(--tx)} .back svg{width:13px;height:13px}
  .brand{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-3);text-decoration:none}
  .brand b{color:var(--gold);font-weight:600}

  .page{max-width:640px;margin:0 auto;padding:0 22px}

  .id{padding:26px 0 4px}
  .ava{width:56px;height:56px;border-radius:50%;object-fit:cover;filter:grayscale(1);box-shadow:0 0 0 1px rgba(255,255,255,.12);display:block;margin-bottom:13px;background:#26262b}
  .ava-fallback{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;color:#d4d4d8;background:radial-gradient(120% 120% at 30% 25%,#45454d,#202024 70%);box-shadow:0 0 0 1px rgba(255,255,255,.12);margin-bottom:13px}
  .id h1{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.08;margin:0 0 6px;color:var(--tx)}
  .id .lens{color:var(--tx-2);font-size:13px;line-height:1.5;margin:0}

  .catbar{position:relative;margin:16px -22px 0}
  .catbar::after{content:"";position:absolute;top:0;right:0;bottom:1px;width:44px;background:linear-gradient(90deg,transparent,var(--bg));pointer-events:none}
  .cats{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:16px 22px 0;border-bottom:1px solid var(--line)}
  .cats::-webkit-scrollbar{display:none}
  .cat{all:unset;cursor:pointer;flex:none;font-size:13.5px;color:var(--tx-3);white-space:nowrap;padding:0 0 12px;position:relative;transition:color .13s}
  .cat .cc{font-family:var(--mono);font-size:11px;color:var(--tx-4);margin-left:5px}
  .cat:hover{color:var(--tx-2)}
  .cat.on{color:var(--gold);font-weight:500}
  .cat.on .cc{color:rgba(237,189,31,.6)}
  .cat.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold);border-radius:2px}
  .cat:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}

  .about{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
  .about h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);margin:0 0 9px}
  .about p{margin:0;font-size:11.5px;line-height:1.55;color:var(--tx-4)}

  .overview{padding:20px 0 18px;border-bottom:1px solid var(--line)}
  .ov-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-2);margin-bottom:9px}
  .overview p{margin:0;font-size:14px;line-height:1.62;color:var(--tx-2);max-width:62ch}
  .ov-note{margin:8px 0 0;font-size:10.5px;color:var(--tx-4);line-height:1.4}

  .toolbar{display:flex;align-items:center;gap:16px;padding:16px 0 4px}
  .search{flex:1;min-width:0;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line-2);padding:6px 2px}
  .search:focus-within{border-color:var(--tx-3)}
  .search svg{flex:none;opacity:.4}
  .search input{all:unset;flex:1;min-width:0;font-size:14px;color:var(--tx)}
  .search input::placeholder{color:var(--tx-4)}
  .sort{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx-3);border:1px solid var(--line);border-radius:var(--r);padding:7px 11px}
  .sort:hover{color:var(--tx);border-color:var(--line-2)} .sort svg{width:12px;height:12px;opacity:.8}
  .sort:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .daygroup{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-3);padding:28px 0 4px;border-top:1px solid var(--line);margin-top:8px}
  .daygroup:first-of-type{border-top:none;margin-top:0;padding-top:14px}

  .row{cursor:pointer;padding:14px;margin:0 -14px;border-radius:6px;transition:background .12s;border-top:1px solid rgba(255,255,255,.045);display:block;text-decoration:none;color:inherit}
  .daygroup + .row{border-top:none}
  .row:hover{background:rgba(255,255,255,.03)}
  blockquote{margin:0;font-family:var(--serif);font-weight:400;font-size:17px;line-height:1.4;color:var(--tx);letter-spacing:-.004em;text-wrap:pretty;overflow-wrap:anywhere}
  blockquote.verbatim{text-indent:-.42em}
  .meta{margin-top:10px;display:flex;align-items:center;gap:8px}
  .ptype{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase}
  .ptype.ver{color:var(--tx-3)} .ptype.sum{color:var(--tx-4)}
  .mdot{color:var(--tx-4);font-size:11px}
  .src{color:var(--tx-3);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;transition:color .13s}
  .row:hover .src{color:var(--tx)}
  .src .ext{width:11px;height:11px;opacity:.6} .src .pg{width:10px;height:10px;color:var(--tx-3);opacity:.9}

  .empty{text-align:center;color:var(--tx-3);font-size:14px;padding:70px 20px}
  .empty b{color:var(--tx-2)}
  .loading{text-align:center;color:var(--tx-4);font-family:var(--mono);font-size:12px;padding:80px 20px;letter-spacing:.08em}

  @media(min-width:1000px){
    .mast-in{max-width:952px}
    .page{display:grid;grid-template-columns:238px minmax(0,1fr);max-width:952px;gap:0;padding:0 22px;align-items:start}
    .railL{position:sticky;top:44px;align-self:start;padding:34px 40px 40px 0}
    .ava,.ava-fallback{width:60px;height:60px} .id h1{font-size:24px}
    .catbar{margin:18px 0 0;border-top:1px solid var(--line)}
    .catbar::after{display:none}
    .cats{flex-direction:column;gap:2px;overflow:visible;padding:16px 0 0;border-bottom:none}
    .cat{width:100%;display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;font-size:13.5px}
    .cat .cc{margin-left:0}
    .cat:hover{color:var(--tx)} .cat.on{color:var(--gold);font-weight:600}
    .cat.on::after{left:0;right:auto;width:16px;bottom:2px}
    .about{margin-top:24px}
    .feed{min-width:0;padding:34px 0 120px;border-left:1px solid var(--line);padding-left:44px}
    .overview{padding-top:0}
  }
</style>
</head>
<body>

<header class="masthead"><div class="mast-in">
  <button class="back" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> All voices</button>
  <a class="brand" id="brandLink">Newsreel <b>Perspectives</b></a>
</div></header>

<div id="app"><div class="loading">Loading…</div></div>

<script>
(function(){
  "use strict";
  var BASE = location.pathname.indexOf('/perspectives') !== -1 ? '/perspectives' : '';
  document.getElementById('backBtn').onclick = function(){ location.href = BASE + '/voices'; };
  document.getElementById('brandLink').href = BASE + '/';

  function getVoiceId(){
    var m = location.pathname.match(/\/voice\/(.+)/);
    if (m) return decodeURIComponent(m[1]).replace(/\/$/, '') || null;
    // query fallback (?v=slug) for local testing
    var q = new URLSearchParams(location.search).get('v');
    return q || null;
  }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function showError(t,m){ document.getElementById('app').innerHTML =
    '<div class="empty" style="max-width:640px;margin:0 auto"><b>'+esc(t)+'</b><br>'+esc(m)+'</div>'; }

  // fine topic slug -> clean top-level category (fixed lookup; 0 tokens)
  var CAT = {
    "economy-trade":"Economy & Work","billionaires-wealth":"Economy & Work","housing-infrastructure":"Economy & Work","food-agriculture":"Economy & Work",
    "trump-administration":"Politics & Power","trump-policy":"Politics & Power","elections":"Politics & Power","congress-legislation":"Politics & Power","state-local-politics":"Politics & Power","supreme-court-legal":"Politics & Power",
    "iran-conflict":"World & War","israel-palestine":"World & War","foreign-policy-diplomacy":"World & War","military-defense":"World & War","terrorism":"World & War","uk-world-politics":"World & War","refugees-humanitarian":"World & War",
    "immigration":"Rights & Justice","abortion-reproductive":"Rights & Justice","civil-rights-race":"Rights & Justice","gender-lgbtq":"Rights & Justice","criminal-justice":"Rights & Justice","gun-policy":"Rights & Justice","religion-faith":"Rights & Justice","protests-activism":"Rights & Justice","free-speech-censorship":"Rights & Justice",
    "ai-technology":"Tech & Science","science-space":"Tech & Science","ufo-paranormal":"Tech & Science",
    "healthcare":"Health & Climate","covid-pandemic":"Health & Climate","climate-environment":"Health & Climate","education":"Health & Climate","drugs-addiction":"Health & Climate",
    "media-press":"Media & Culture","media-personalities":"Media & Culture","culture-war":"Media & Culture","celebrity-entertainment":"Media & Culture","sports":"Media & Culture","epstein-scandal":"Media & Culture"
  };
  var CAT_ORDER = ["Economy & Work","Politics & Power","Tech & Science","Health & Climate","Media & Culture","Rights & Justice","World & War"];
  var PLATNAME = {youtube:"YouTube",bluesky:"Bluesky",x:"X",tiktok:"TikTok",substack:"Substack",instagram:"Instagram",blog:"Blog",podcast:"Podcast"};
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function fmtDate(d){ if(!d) return ""; var p=String(d).split("-"); if(p.length<3) return d; return MONTHS[(+p[1]-1)]+" "+(+p[2]); }
  function cleanQuote(q){
    q = String(q||"");
    q = q.replace(/https?:\/\/\S+/g,"");                 // full URLs
    q = q.replace(/\bt\.co\S*/g,"");                       // leftover twitter shortlinks
    q = q.replace(/\b[\w-]+\.(com|org|net|gov|social|co)\/\S*/g,"");
    q = q.replace(/(@[\w-]+)\.(bsky\.social|social)\b/g,"$1");   // keep the @handle, drop its domain
    q = q.replace(/\s+/g," ").trim();
    q = q.replace(/[\s.–—…:·-]*\b(Watch|Watch this|Read more|Thread|A thread|Link in bio)\b[\s.:·—-]*$/i,""); // trailing CTAs
    q = q.replace(/[\s.–—…:]+$/,"").trim();
    // the stance pipeline caps quotes at 280 chars (often mid-word) — clamp to a clean word boundary
    if(q.length>220){ var t=q.slice(0,218); var i=t.lastIndexOf(" "); if(i>120) t=t.slice(0,i); q=t.replace(/[,;:.\s]+$/,"")+"…"; }
    return q;
  }
  function isVideo(p){ return p==="youtube"; }

  // flatten the accumulated stance store into one positions list
  function buildPositions(stanceData){
    var out = [], seen = {};
    var topics = (stanceData && stanceData.topics) || [];
    topics.forEach(function(t){
      (t.stances||[]).forEach(function(s){
        var key = s.sourceUrl || (s.platform+"|"+(s.quote||"").slice(0,60));
        if(seen[key]) return; seen[key]=true;
        var vid = isVideo(s.platform);
        // verbatim = the person's own words (text posts); summary = derived position (video/clip)
        var text = vid ? (s.summary || cleanQuote(s.quote)) : cleanQuote(s.quote);
        if(!text || text.length < 8) text = s.summary || cleanQuote(s.quote);
        if(!text || text.length < 8) return;
        out.push({
          date: s.date || (s.timestamp||"").slice(0,10),
          text: text, video: vid, platform: s.platform || "",
          url: s.sourceUrl || "", cat: CAT[s.topic] || "Other"
        });
      });
    });
    out.sort(function(a,b){ return (a.date<b.date)?1:(a.date>b.date?-1:0); });
    return out;
  }

  function render(voice, POS){
    var state = { cat:"All", q:"" };

    function matches(p){
      if(state.cat!=="All" && p.cat!==state.cat) return false;
      if(state.q && p.text.toLowerCase().indexOf(state.q.toLowerCase())<0) return false;
      return true;
    }
    function buildCats(){
      var counts={}; POS.forEach(function(p){counts[p.cat]=(counts[p.cat]||0)+1;});
      var present = CAT_ORDER.filter(function(c){return counts[c];});
      var html = '<button class="cat'+(state.cat==="All"?" on":"")+'" data-cat="All">All<span class="cc">'+POS.length+'</span></button>';
      present.forEach(function(c){
        html += '<button class="cat'+(state.cat===c?" on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'<span class="cc">'+counts[c]+'</span></button>';
      });
      var nav = document.getElementById("cats"); nav.innerHTML = html;
      Array.prototype.forEach.call(nav.querySelectorAll(".cat"),function(b){
        b.onclick=function(){ state.cat=b.getAttribute("data-cat"); draw(); };
      });
    }
    function draw(){
      buildCats();
      var list = POS.filter(matches);
      var g = document.getElementById("grid");
      if(!list.length){ g.innerHTML=""; document.getElementById("empty").style.display="block"; return; }
      document.getElementById("empty").style.display="none";
      var extsvg='<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>';
      var play='<svg class="pg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      var html="", curDay=null;
      list.forEach(function(p){
        if(p.date!==curDay){ html+='<div class="daygroup">'+fmtDate(p.date)+'</div>'; curDay=p.date; }
        var body = p.video ? '<blockquote class="sum">'+esc(p.text)+'</blockquote>'
                           : '<blockquote class="verbatim">&ldquo;'+esc(p.text)+'&rdquo;</blockquote>';
        var ptype = p.video ? '<span class="ptype sum">Summary</span>' : '<span class="ptype ver">Verbatim</span>';
        var src = '<a class="src" href="'+esc(p.url||'#')+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+(p.video?play:"")+esc(PLATNAME[p.platform]||p.platform)+extsvg+'</a>';
        var href = p.url ? ' href="'+esc(p.url)+'" target="_blank" rel="noopener"' : '';
        html += '<a class="row"'+href+'>'+body+'<div class="meta">'+ptype+'<span class="mdot">&middot;</span>'+src+'</div></a>';
      });
      g.innerHTML = html;
    }

    // scaffold
    var photoUrl = voice.photo ? (BASE + '/data' + voice.photo) : '';   // files live under /data/photos/
    var photo = photoUrl
      ? '<img class="ava" src="'+esc(photoUrl)+'" alt="'+esc(voice.name)+'" onerror="this.outerHTML=\'<div class=&quot;ava-fallback&quot;>'+esc((voice.name||"?").slice(0,1))+'</div>\'">'
      : '<div class="ava-fallback">'+esc((voice.name||"?").slice(0,1))+'</div>';
    var ov = "";
    if(voice.overview){
      var upd = voice.overviewUpdatedAt ? ' &middot; updated '+esc(voice.overviewUpdatedAt) : '';
      ov = '<section class="overview"><div class="ov-label">Overview</div>'+
           '<p>'+esc(voice.overview)+'</p>'+
           '<p class="ov-note">AI-written summary of tracked posts'+upd+'</p></section>';
    }
    document.getElementById("app").innerHTML =
      '<div class="page">'+
        '<aside class="railL">'+
          '<header class="id">'+photo+'<h1>'+esc(voice.name)+'</h1>'+
            (voice.lens?'<p class="lens">'+esc(voice.lens)+'</p>':'')+'</header>'+
          '<div class="catbar"><nav class="cats" id="cats"></nav></div>'+
          '<div class="about"><h4>About</h4><p>Positions are '+esc(firstName(voice.name))+'’s own public statements, tracked across the platforms '+esc(firstName(voice.name))+' posts on and aggregated here — not edited or endorsed by Newsreel.</p></div>'+
        '</aside>'+
        '<main class="feed">'+
          ov+
          '<div class="toolbar">'+
            '<label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'+
              '<input id="q" type="text" placeholder="Search positions" autocomplete="off"></label>'+
            '<button class="sort" id="sortbtn"><span id="sortlabel">Newest</span>'+
              '<svg id="sorticon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>'+
          '</div>'+
          '<div class="rows" id="grid"></div>'+
          '<div class="empty" id="empty" style="display:none">No positions tracked yet.</div>'+
        '</main>'+
      '</div>';

    var sortNewest = true;
    document.getElementById("q").addEventListener("input",function(e){ state.q=e.target.value; draw(); });
    document.getElementById("sortbtn").onclick=function(){
      sortNewest=!sortNewest; POS.reverse();
      document.getElementById("sortlabel").textContent = sortNewest?"Newest":"Oldest";
      document.getElementById("sorticon").style.transform = sortNewest?"none":"rotate(180deg)";
      draw();
    };
    draw();
  }
  function firstName(n){ return (n||"This voice").split(" ")[0]; }

  // ---- load ----
  var voiceId = getVoiceId();
  if(!voiceId){ showError("No voice specified","The URL is missing a voice identifier."); return; }
  fetch(BASE+"/data/voices.json").then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(voices){
      var voice=null; for(var i=0;i<voices.length;i++){ if(voices[i].id===voiceId){ voice=voices[i]; break; } }
      if(!voice){ showError("Voice not found","“"+voiceId+"” is not tracked in Perspectives."); return; }
      document.title = voice.name+" · Perspectives";
      return fetch(BASE+"/data/stances/"+voiceId+".json").then(function(r){ return r.ok?r.json():null; })
        .then(function(stanceData){ render(voice, buildPositions(stanceData||{})); });
    })
    .catch(function(err){ console.error("[Perspectives] load failed",err); showError("Failed to load","Something went wrong. Please try again."); });
})();
</script>
</body>
</html>
